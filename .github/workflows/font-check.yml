# 朱雀仿宋標題字子集檢查：缺字、借用別頁子集、未登記頁面會失敗；?v= 問題列為警告。
# 說明見 tools/check_font_subsets.py 與 README「每個用朱雀標題字的頁面要有自己的子集」。
name: font-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  font-subsets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 比對 ?v= 與子集最後更新日要用 git log

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install fonttools brotli

      - name: 快取朱雀仿宋原始字體
        uses: actions/cache@v4
        with:
          path: ~/.cache/zhuque
          key: zhuque-${{ hashFiles('tools/check_font_subsets.py') }}

      - run: python3 tools/check_font_subsets.py
